name: Windows Desktop Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-windows-ob508

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Latry with Opus submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.9 for Windows MSVC 2022
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtconnectivity qtlocation qtpositioning qtmultimedia'
          cache: true

      - name: Configure (MSVC)
        run: >
          cmake -S android -B build/windows
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DBUILD_TESTING=OFF
          -DOPUS_BUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/windows --config Release --parallel 4

      - name: Package portable application
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'dist/Latry-by-OB508-Windows-x64'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $exe = Get-ChildItem 'build/windows' -Recurse -Filter 'applatry.exe' |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $exe) { throw 'Built applatry.exe was not found' }
          Copy-Item $exe.FullName (Join-Path $out 'Latry-by-OB508.exe')
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --qmldir android --compiler-runtime (Join-Path $out 'Latry-by-OB508.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item 'LICENSE' $out
          Compress-Archive -Path "$out/*" -DestinationPath 'dist/Latry-by-OB508-Windows-x64.zip' -Force

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Latry-by-OB508-Windows-x64
          path: dist/Latry-by-OB508-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish_beta:
    name: Publish public Windows BETA
    needs: windows
    runs-on: ubuntu-latest
    # Publishing a release needs repository write access; the build above
    # works with read-only access.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download portable ZIP from this run
        uses: actions/download-artifact@v4
        with:
          name: Latry-by-OB508-Windows-x64
          path: dist

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd dist
          sha256sum Latry-by-OB508-Windows-x64.zip > Latry-by-OB508-Windows-x64.zip.sha256

      - name: Create public GitHub prerelease (only once)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA_TAG: v0.0.19-windows-beta.1
        run: |
          set -euo pipefail
          if gh release view "$BETA_TAG" >/dev/null 2>&1; then
            echo "Release $BETA_TAG already exists, leaving it unchanged."
            exit 0
          fi
          cat > beta-notes.md <<'NOTES'
          ## Latry by OB508 – Windows BETA 1

          **Javna testna izdaja za Windows 10/11 (64-bit).** Prenos ne potrebuje GitHub prijave.

          - Prenesite `Latry-by-OB508-Windows-x64.zip`.
          - ZIP razširite v mapo in zaženite `Latry-by-OB508.exe`.
          - Namizno okno ter tipka **F9** za vklop/izklop PTT.
          - Prenosna aplikacija z vključenimi Qt knjižnicami in kodekom Opus.

          **BETA:** Build je uspešno preveden, delovanje na Windows napravah pa še ni potrjeno. Pred uporabo oddajanja preverite povezavo na SVXReflector, predvajanje, mikrofon in PTT. Napake sporočite v projektu GitHub.

          **English:** Experimental Windows x64 portable build. Extract ZIP and run `Latry-by-OB508.exe`. F9 toggles PTT. Audio, networking and UI require testing.
          NOTES
          gh release create "$BETA_TAG" \
            dist/Latry-by-OB508-Windows-x64.zip \
            dist/Latry-by-OB508-Windows-x64.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Latry by OB508 – Windows BETA 1" \
            --notes-file beta-notes.md \
            --prerelease
